<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barebones Test</title>
    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="audioNoticeOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); color:white; text-align:center; padding-top:30vh; font-size:22px; z-index:10000; cursor:pointer;">
        <p>Audio playback is paused by your browser.</p>
        <p>Click or tap anywhere on this message to start the audio visualizer.</p>
        <button id="startAudioButton" style="font-size:20px; padding:15px 30px; margin-top:20px; background:#333; border:2px solid #555; color:white; cursor:pointer;">Start Audio</button>
    </div>
    <canvas id="visualizerCanvas"></canvas>
    <script type="module" src="main.js"></script>
